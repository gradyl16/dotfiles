#  Catppuccin Mocha
#  ┬  ┌─┐┌┬┐
#  │  └─┐ ││
#  ┴─┘└─┘─┴┘

user: "#cba6f7"                     # mauve
group: "#b4befe"                    # lavender
permission:
  read: "#a6e3a1"                   # green
  write: "#f9e2af"                  # yellow
  exec: "#eba0ac"                   # maroon
  exec-sticky: "#cba6f7"            # mauve
  no-access: "#a6adc8"              # subtext0
  octal: "#94e2d5"                  # teal
  acl: "#94e2d5"                    # teal
  context: "#89dceb"                # sky
date:
  hour-old: "#94e2d5"               # teal
  day-old: "#89dceb"                # sky
  older: "#74c7ec"                  # sapphire
size:
  none: "#a6adc8"                   # subtext0
  small: "#a6e3a1"                  # green
  medium: "#f9e2af"                 # yellow
  large: "#fab387"                  # peach
inode:
  valid: "#f5c2e7"                  # pink
  invalid: "#a6adc8"                # subtext0
links:
  valid: "#f5c2e7"                  # pink
  invalid: "#a6adc8"                # subtext0
tree-edge: "#bac2de"                # subtext1
git-status:
  default: "#cdd6f4"                # text
  unmodified: "#cdd6f4"
  ignored: "#a6adc8"
  new-in-index: "#a6e3a1"
  new-in-workdir: "#a6e3a1"
  typechange: "#f9e2af"
  deleted: "#f38ba8"
  renamed: "#a6e3a1"
  modified: "#f9e2af"
  conflicted: "#f38ba8"
